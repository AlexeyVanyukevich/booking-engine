services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_engine
    ports:
      # 5433 on the host, so a locally installed Postgres on 5432 keeps working.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d booking_engine']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. `app` waits for it to finish successfully, so the schema is
  # always in place before the first request.
  migrate:
    build: .
    command: ['node', 'dist/src/db/migrate.js']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking_engine
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking_engine
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_RANGE_DAYS: ${MAX_RANGE_DAYS:-366}
      DEFAULT_HOLD_MINUTES: ${DEFAULT_HOLD_MINUTES:-10}
      MAX_HOLD_MINUTES: ${MAX_HOLD_MINUTES:-60}
      HOLD_SWEEP_INTERVAL_SECONDS: ${HOLD_SWEEP_INTERVAL_SECONDS:-60}
      HOLD_SWEEP_ENABLED: ${HOLD_SWEEP_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # The key console. Note the host part of the port mapping: `127.0.0.1:3001:3001`, not
  # `3001:3001`. The console issues keys without authenticating anyone, which is safe only
  # while it is unreachable from outside this machine. Publishing it on 0.0.0.0 would hand
  # anyone who finds the port the ability to mint an all-scopes key for any tenant.
  console:
    build: .
    command: ['node', 'dist/src/console.js']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking_engine
      CONSOLE_PORT: '3001'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${CONSOLE_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The same image as `app`, run as a sweeper. Optional: the API processes sweep on their own
  # timer, and the advisory lock means running both is safe.
  worker:
    build: .
    command: ['node', 'dist/src/worker.js']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking_engine
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOLD_SWEEP_INTERVAL_SECONDS: ${HOLD_SWEEP_INTERVAL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
